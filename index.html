<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E6E62">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuentas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mis Cuentas Claras</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
html{-webkit-text-size-adjust:100%}body{margin:0}
/* Layout: libreta de cuentas — encabezado sobrio, pestañas (abajo en celular), tarjetas solo donde hay un objeto (crédito) */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --sunk:#E3E9E7; --line:#CFD8D5;
  --ink:#16232A; --muted:#5B6B70; --accent:#0E6E62; --accent-ink:#FFFFFF; --accent-soft:#D3EAE5;
  --gasto:#B4472F; --gasto-soft:#F5DDD6; --ok:#2C7A3F; --warn:#A86A00; --warn-soft:#F7E8C8; --bad:#B4472F;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1719; --surface:#172225; --sunk:#1F2C30; --line:#2C3B40;
  --ink:#E4ECEA; --muted:#93A5A9; --accent:#4CC2AE; --accent-ink:#06211C; --accent-soft:#163A35;
  --gasto:#F08A70; --gasto-soft:#3A2420; --ok:#6BCB82; --warn:#E8B04B; --warn-soft:#3A2E16; --bad:#F08A70;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1719; --surface:#172225; --sunk:#1F2C30; --line:#2C3B40;
  --ink:#E4ECEA; --muted:#93A5A9; --accent:#4CC2AE; --accent-ink:#06211C; --accent-soft:#163A35;
  --gasto:#F08A70; --gasto-soft:#3A2420; --ok:#6BCB82; --warn:#E8B04B; --warn-soft:#3A2E16; --bad:#F08A70;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sync{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)}.dot.local{background:var(--warn)}.dot.bad{background:var(--bad)}
.authcard{max-width:420px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px}
.authcard h1{font-size:1.4rem;color:var(--accent)}
.authcard .btn.primary{justify-content:center}
.authlinks{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}
.okmsg{color:var(--ok);font-size:.9rem;margin:0}.err{margin:0}

nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;margin-bottom:20px;width:max-content;max-width:100%}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:600 .92rem var(--body);padding:8px 16px;border-radius:999px;cursor:pointer;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
nav.tabs svg{width:18px;height:18px}
@media (max-width:640px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;width:auto;border-radius:0;margin:0;z-index:20;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.tabs button{flex-direction:column;gap:2px;font-size:.72rem;padding:6px 8px;border-radius:10px;flex:1}
  nav.tabs button[aria-selected="true"]{box-shadow:none;background:var(--accent-soft);color:var(--accent)}
}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .9rem var(--body);padding:9px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 8px;min-height:32px}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:21;border-radius:999px;padding:14px 20px;box-shadow:0 6px 18px rgb(0 0 0 / .18)}
@media (max-width:640px){.fab{bottom:calc(84px + env(safe-area-inset-bottom,0px));right:calc(16px + env(safe-area-inset-right,0px))}}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:40px;width:100%}
.toolbar input,.toolbar select{width:auto;flex:1 1 140px;min-width:0}

/* Resumen */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--num);font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v.neg{color:var(--gasto)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h3{margin-bottom:12px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.88rem}
.bar .track{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--gasto);border-radius:5px}
.bar .n{font-family:var(--num);font-size:.84rem}
.months{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:6px}
.months .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.months .b{width:100%;max-width:38px;background:var(--accent-soft);border-radius:4px 4px 0 0;min-height:2px}
.months .col.cur .b{background:var(--accent)}
.months small{font-size:.7rem;color:var(--muted)}

/* Listas */
.day{margin-bottom:14px}
.day > .label{display:flex;justify-content:space-between;padding:0 4px 6px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--gasto-soft);color:var(--gasto);font-size:.8rem;font-weight:700}
.ic.pay{background:var(--accent-soft);color:var(--accent)}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:.8rem;color:var(--muted)}
.amt{font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.neg{color:var(--gasto)}
.chip{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--gasto-soft);color:var(--bad)}
.chip.in{background:var(--accent-soft);color:var(--accent)}
.chip.out{background:var(--gasto-soft);color:var(--gasto)}
.kpi .v.pos{color:var(--accent)}
.seg{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px}
.seg label{flex:1;text-align:center;padding:8px;border-radius:9px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg input:checked+span{color:var(--ink)}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}
.group-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin:8px 0 12px}

.creds{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
@media (max-width:400px){.creds{grid-template-columns:minmax(0,1fr)}}
.cred{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cred .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.cred dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.cred dt{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cred dd{margin:0;font-family:var(--num);font-weight:600;font-size:.92rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.prog{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.prog > div{height:100%;background:var(--accent)}
.cred .acts{display:flex;gap:8px;flex-wrap:wrap}
.pagos{font-size:.85rem;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px;max-height:160px;overflow:auto}
.pagos div{display:flex;justify-content:space-between;gap:8px}

.log{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 12px;border-top:1px solid var(--line)}
.log:first-child{border-top:0}
.log time{font-family:var(--num);font-size:.78rem;color:var(--muted);white-space:nowrap;padding-top:2px}

.empty{text-align:center;padding:36px 16px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty strong{color:var(--ink);font-family:var(--display);font-size:1.05rem}

/* Hoja (formulario) */
[hidden]{display:none!important}
.overlay{position:fixed;inset:0;background:rgb(10 20 22 / .45);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:16px;width:100%;max-width:480px;max-height:calc(100% - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
@media (max-width:640px){
  .overlay{align-items:flex-end;padding:0}
  .sheet{border-radius:16px 16px 0 0;max-height:92%;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields .full{grid-column:1/-1}
@media (max-width:400px){.fields{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.hint{font-size:.78rem;color:var(--muted)}
.sheet .foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.sheet .foot .r{display:flex;gap:8px;margin-left:auto}
.confirm{background:var(--gasto-soft);color:var(--ink);border-radius:10px;padding:12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.err{color:var(--bad);font-size:.85rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;font-weight:600;font-size:.9rem}
@media (max-width:640px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>
</head><body>

<div class="wrap" id="auth" hidden></div>
<div class="wrap" id="app" hidden>
  <header class="top">
    <div>
      <h1>Mis Cuentas Claras</h1>
      <div class="muted" style="font-size:.88rem">Gastos, créditos e historial en soles</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="btn" id="btnExp" type="button">Exportar respaldo</button><label class="btn" for="fileImp" style="cursor:pointer">Importar respaldo</label><input type="file" id="fileImp" accept=".json,application/json" hidden></div>
      <div class="sync" id="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">Cargando…</span></div>
      <div class="sync"><span id="who"></span><button class="btn ghost" id="btnOut" type="button">Salir</button></div>
    </div>
  </header>

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="resumen" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumen</button>
    <button role="tab" data-tab="gastos" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Gastos</button>
    <button role="tab" data-tab="creditos" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10l9-6 9 6M5 10v8M19 10v8M9 10v8M15 10v8M3 20h18"/></svg>Créditos</button>
    <button role="tab" data-tab="historial" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historial</button>
  </nav>

  <main id="view"></main>
</div>

<button class="btn primary fab" id="fab" type="button" hidden>+ Nuevo gasto</button>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
const CATS=["Alimentación","Transporte","Vivienda","Servicios","Salud","Educación","Entretenimiento","Ropa","Otros"];
const METODOS=["Efectivo","Débito","Crédito","Yape/Plin","Transferencia"];
const fmt=new Intl.NumberFormat("es-PE",{style:"currency",currency:"PEN",minimumFractionDigits:2});
const money=n=>fmt.format(+n||0);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const ym=s=>s.slice(0,7);
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fDate=s=>{if(!s)return"";const[y,m,d]=s.split("-");return +d+" "+MES[+m-1]+" "+y};
const fMonth=s=>{const[y,m]=s.split("-");return MES[+m-1]+" "+y};
const addMonths=(s,k)=>{const[y,m,d]=s.split("-").map(Number);const t=new Date(y,m-1+k,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(Math.min(d,last))};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- Cuenta, sincronización y grupos (Supabase) ---------- */
const CFG=window.CUENTAS_CONFIG||{};
const configured=!!(CFG.url&&CFG.key&&!/TU-PROYECTO|PEGA-AQUI/.test(CFG.url+CFG.key));
const sb=configured&&window.supabase?supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"implicit"}}):null;
let saliendo=false;let docs={};let ajenos={};let grupos=[];let miembros=[];let me=null;let outbox=[];let lastPull="";let syncing=false;let lastErr=null;
const enRecuperacion=/type=recovery/.test(location.hash);
const K=s=>"cc-"+s+"-"+(me&&me.id);
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function saveLocal(){if(!me)return;lsSet(K("docs"),docs);lsSet(K("ajenos"),ajenos);lsSet(K("out"),outbox);lsSet(K("pull"),lastPull)}
function queueOp(id,data,grupo){
  outbox=outbox.filter(o=>o.id!==id);
  outbox.push({id,data:data||null,grupo:grupo!==undefined?grupo:((data&&data.grupo)||null)});
  saveLocal();updSync();flush();
}
function put(id,data){docs={...docs,[id]:data};render();queueOp(id,data)}
function del(id){const g=(docs[id]&&docs[id].grupo)||null;const c={...docs};delete c[id];docs=c;render();queueOp(id,null,g)}
function log(accion,tipo,resumen,monto){put("l-"+uid(),{t:"log",ts:new Date().toISOString(),accion,tipo,resumen,monto:monto??null})}
function setSync(kind,txt){document.getElementById("syncDot").className="dot "+kind;document.getElementById("syncTxt").textContent=txt}
function updSync(){
  if(!me)return;const n=outbox.length;
  if(!navigator.onLine)setSync("local",n?`Sin internet · ${n} cambio(s) por subir`:"Sin internet · todo guardado en el equipo");
  else if(syncing)setSync("local","Sincronizando…");
  else if(lastErr)setSync("bad",n?`No se pudo sincronizar · ${n} pendiente(s)`:"No se pudo sincronizar");
  else if(n)setSync("local",`${n} cambio(s) por subir`);
  else setSync("on","Sincronizado");
}
function netErr(e){lastErr=e||true;const m=String(e&&(e.message||e.code)||"");if(/JWT|token|401|session/i.test(m)&&sb)sb.auth.refreshSession().catch(()=>{})}

async function flush(){
  if(!sb||!me||syncing||!navigator.onLine||!outbox.length)return;
  syncing=true;updSync();let ok=false;
  try{
    const batch=outbox.slice(0,200);
    const rows=batch.map(o=>({user_id:me.id,id:o.id,data:o.data||{},deleted:!o.data,grupo_id:o.grupo||null}));
    const{error}=await sb.from("registros").upsert(rows,{onConflict:"user_id,id"});
    if(error)throw error;
    const sent=new Set(batch);outbox=outbox.filter(o=>!sent.has(o));lastErr=null;ok=true;saveLocal();
  }catch(e){netErr(e)}finally{syncing=false;updSync()}
  if(ok&&outbox.length)flush();
}

async function cargarGrupos(){
  if(!sb||!me)return;
  try{
    const[g,m]=await Promise.all([
      sb.from("grupos").select("id,nombre,creado_por").order("nombre"),
      sb.from("grupo_miembros").select("grupo_id,user_id,email")
    ]);
    if(g.error)throw g.error;if(m.error)throw m.error;
    grupos=g.data||[];miembros=m.data||[];
    const ids=new Set(grupos.map(x=>x.id));let ch=false;
    for(const k of Object.keys(ajenos)){if(!ids.has(ajenos[k].grupo)){delete ajenos[k];ch=true}}
    if(ch)saveLocal();
  }catch(e){netErr(e)}
}

let pulling=false;
async function pull(){
  if(!sb||!me||pulling||!navigator.onLine)return;
  pulling=true;
  try{
    await flush();
    await cargarGrupos();
    let from=lastPull,changed=false;
    for(;;){
      let q=sb.from("registros").select("id,user_id,data,deleted,updated_at").order("updated_at",{ascending:true}).limit(1000);
      if(from)q=q.gt("updated_at",from);
      const{data,error}=await q;if(error)throw error;
      const pend=new Set(outbox.map(o=>o.id));
      const nD={...docs},nA={...ajenos};
      for(const r of data){
        from=r.updated_at;
        if(r.user_id!==me.id){
          // registro de otra persona en uno de mis grupos
          if(r.deleted)delete nA[r.id];else nA[r.id]={...r.data,_by:r.user_id};
          changed=true;continue;
        }
        if(pend.has(r.id))continue;
        if(r.deleted)delete nD[r.id];else nD[r.id]=r.data;
        changed=true;
      }
      docs=nD;ajenos=nA;
      if(data.length<1000)break;
    }
    lastPull=from;lastErr=null;saveLocal();if(changed)render();
  }catch(e){netErr(e)}finally{pulling=false;updSync()}
}
window.addEventListener("online",()=>{lastErr=null;updSync();pull()});
window.addEventListener("offline",updSync);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pull()});
setInterval(()=>{if(document.visibilityState==="visible")pull()},60000);

  docs=lsGet(K("docs"),{});ajenos=lsGet(K("ajenos"),{});outbox=lsGet(K("out"),[]);lastPull=lsGet(K("pull"),"");lastErr=null;
  // datos que quedaron de la versión sin cuenta en este equipo
  const old=lsGet("cuentas-claras-v1",null);

    if(session&&session.user&&ev==="SIGNED_IN"&&!enRecuperacion&&(!me||me.id!==session.user.id))setTimeout(()=>startSession(session.user),0);
  });

/* ---------- Respaldo: exportar / importar ---------- */
async function exportar(){
  const data=JSON.stringify({app:"cuentas-claras",version:2,exportado:new Date().toISOString(),docs},null,1);
  const name="cuentas-claras-"+today()+".json";
  const file=new File([data],name,{type:"application/json"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Respaldo Cuentas Claras"});return}}catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("Respaldo descargado");
}
function importar(file){
  const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result);if(!j||j.app!=="cuentas-claras"||typeof j.docs!=="object")throw 0;
    const seen=new Set(logs().map(i=>i.ts+i.resumen));const cambios=[];
    for(const[k,v]of Object.entries(j.docs)){
      if(v.t==="log"){const items=v.items?v.items:[v];items.forEach(it=>{if(!seen.has(it.ts+it.resumen)){seen.add(it.ts+it.resumen);cambios.push(["l-"+uid(),{t:"log",ts:it.ts,accion:it.accion,tipo:it.tipo,resumen:it.resumen,monto:it.monto??null}])}});continue}
      const cur=docs[k];
      if(!cur||(JSON.stringify(cur)!==JSON.stringify(v)&&((v.editado||v.creado||"")>=(cur.editado||cur.creado||"")||v.t==="credito"&&(v.pagos||[]).length>(cur.pagos||[]).length)))cambios.push([k,v]);
    }
    const next={...docs};cambios.forEach(([k,v])=>{next[k]=v;outbox=outbox.filter(o=>o.id!==k);outbox.push({id:k,data:v})});
    docs=next;saveLocal();render();updSync();flush();
    toast(cambios.length?`Respaldo importado: ${cambios.length} cambio(s)`:"Ya tenías todo lo del respaldo");
  }catch(e){toast("Ese archivo no es un respaldo de Cuentas Claras")}};
  r.readAsText(file);
}

/* ---------- Cálculos ---------- */
const gastos=()=>[...Object.entries(docs),...Object.entries(ajenos)].filter(([,d])=>d.t==="gasto").map(([id,d])=>({id,...d}));
const creditos=()=>Object.entries(docs).filter(([,d])=>d.t==="credito").map(([id,d])=>({id,...d}));
const logs=()=>Object.values(docs).filter(d=>d.t==="log").flatMap(d=>d.items?d.items:[d]).sort((a,b)=>b.ts.localeCompare(a.ts));
function cuotaCalc(P,tea,n){P=+P;n=+n;if(!P||!n)return 0;const i=Math.pow(1+(+tea||0)/100,1/12)-1;return i?P*i/(1-Math.pow(1+i,-n)):P/n}
function credInfo(c){
  const cuota=+c.cuota||cuotaCalc(c.monto,c.tasa,c.cuotas);
  const total=cuota*(+c.cuotas||0);
  const pagado=(c.pagos||[]).reduce((s,p)=>s+(+p.monto||0),0);
  const pendiente=Math.max(0,total-pagado);
  const pagadas=cuota?Math.min(+c.cuotas,Math.floor((pagado+0.005)/cuota)):0;
  const prox=pendiente>0.005&&c.inicio?addMonths(c.inicio,pagadas):null;
  const presto=c.dir==="presto";
  let estado="ok",etq="Al día";
  if(pendiente<=0.005){estado="ok";etq=presto?"Cobrado":"Pagado"}
  else if(prox&&prox<today()){estado="bad";etq="Atrasado"}
  else if(prox){const dd=(new Date(prox)-new Date(today()))/864e5;if(dd<=7){estado="warn";etq=dd===0?"Vence hoy":"Vence en "+dd+" d"}}
  return{cuota,total,pagado,pendiente,pagadas,prox,estado,etq,presto,pct:total?Math.min(100,pagado/total*100):0};
}
const esPresto=c=>c.dir==="presto";

  </div>

    <section class="panel"><h3>Gastos por categoría</h3>
      ${cats.length?`<div class="bars">${cats.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${(v/max*100).toFixed(1)}%"></div></div><span class="n">${money(v)}</span></div>`).join("")}</div>`:`<p class="muted">Sin gastos en ${fMonth(mesSel)}.</p>`}

function vCreditos(){
  const ord=(a,b)=>(credInfo(a).pendiente<=0.005)-(credInfo(b).pendiente<=0.005)||(a.inicio||"").localeCompare(b.inicio||"");
  const all=creditos();const debo=all.filter(c=>!esPresto(c)).sort(ord),med=all.filter(esPresto).sort(ord);
  const tot=arr=>arr.reduce((s,c)=>s+credInfo(c).pendiente,0);
  if(!all.length)return`<div class="toolbar"><h2>Créditos y préstamos</h2></div><div class="empty"><strong>No tienes créditos ni préstamos registrados</strong><span>Registra lo que debes (un préstamo, tarjeta o compra en cuotas) o el dinero que tú prestaste a otra persona.</span><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn primary" data-act="nuevo-credito">+ Algo que debo</button><button class="btn" data-act="nuevo-prestamo">+ Dinero que presté</button></div></div>`;
  const sec=(titulo,arr,color,vacio,act,btn)=>`<section style="margin-bottom:28px"><div class="group-h"><h2>${titulo} · <span class="num" style="color:var(${color})">${money(tot(arr))}</span></h2><button class="btn" data-act="${act}">${btn}</button></div>
    ${arr.length?`<div class="creds">${arr.map(credCard).join("")}</div>`:`<p class="muted">${vacio}</p>`}</section>`;
  return sec("Lo que debo",debo,"--gasto","No tienes deudas registradas.","nuevo-credito","+ Deuda")
        +sec("Lo que me deben",med,"--accent","No has registrado dinero prestado.","nuevo-prestamo","+ Préstamo");
}

function vHistorial(){
  let ls=logs();
  if(hTipo)ls=ls.filter(l=>l.tipo===hTipo);
  if(hTxt){const q=hTxt.toLowerCase();ls=ls.filter(l=>(l.resumen||"").toLowerCase().includes(q))}
  const ACC={crear:["Creado","ok"],editar:["Editado","warn"],eliminar:["Eliminado","bad"],pago:["Pago","ok"],"quitar-pago":["Pago quitado","bad"],cobro:["Cobro","ok"],"quitar-cobro":["Cobro quitado","bad"]};
  return`<div class="toolbar"><h2 style="flex:1 1 100%">Historial personal</h2>
    <select id="htipo" aria-label="Tipo"><option value="">Todo</option><option value="gasto" ${hTipo==="gasto"?"selected":""}>Gastos</option><option value="credito" ${hTipo==="credito"?"selected":""}>Créditos y préstamos</option></select>
    <input id="htxt" type="search" placeholder="Buscar en el historial…" value="${esc(hTxt)}" aria-label="Buscar en historial"></div>
  ${ls.length?`<div class="rows">${ls.slice(0,400).map(l=>{const d=new Date(l.ts);const[a,k]=ACC[l.accion]||[l.accion,""];return`<div class="log"><time datetime="${l.ts}">${d.getDate()} ${MES[d.getMonth()]} ${d.getFullYear()}<br>${pad(d.getHours())}:${pad(d.getMinutes())}</time><div style="min-width:0"><span class="chip ${k}">${a}</span> <span class="muted" style="font-size:.78rem">${l.tipo==="gasto"?"Gasto":"Crédito"}</span><div style="overflow-wrap:anywhere">${esc(l.resumen)}</div></div><div class="amt">${l.monto!=null?money(l.monto):""}</div></div>`}).join("")}</div>`
  :`<div class="empty"><strong>Aún no hay actividad</strong><span>Cada vez que crees, edites, pagues o elimines algo aparecerá aquí con fecha y hora.</span></div>`}`;
}

function msgErr(e){

  if(/Solo quien creó/i.test(m))return"Solo quien creó el grupo puede invitar.";

  return"No se pudo completar. Revisa tu conexión e inténtalo de nuevo.";
}
